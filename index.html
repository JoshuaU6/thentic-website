<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Primary Meta -->
    <title>Thentic Liquor — Premium. Timeless. Unforgettable.</title>
    <meta name="description" content="Premium ready-to-drink cocktails and mocktails crafted in Lagos. Lagos Long Island, Ikoyi Nights, Passion Fruit Mojito and more. Order via WhatsApp." />
    <meta name="theme-color" content="#8B1A1A" />

    <!-- Open Graph — WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thenticliquor.com" />
    <meta property="og:title" content="Thentic Liquor — Premium. Timeless. Unforgettable." />
    <meta property="og:description" content="Premium ready-to-drink cocktails and mocktails crafted in Lagos. Order your favourite Thentic Mix today." />
    <meta property="og:image" content="https://thenticliquor.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Thentic Mix — Lagos Long Island premium ready-to-drink cocktail" />
    <meta property="og:site_name" content="Thentic Liquor" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thentic Liquor — Premium. Timeless. Unforgettable." />
    <meta name="twitter:description" content="Premium ready-to-drink cocktails and mocktails crafted in Lagos." />
    <meta name="twitter:image" content="https://thenticliquor.com/og-image.jpg" />

    <!-- WhatsApp specifically uses og:image — above tags handle it -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
